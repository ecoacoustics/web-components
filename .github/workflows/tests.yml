name: Run Tests

on: pull_request

jobs:
  Setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Cache is keyed per OS so that Linux packages are never restored on Windows/macOS.
      # Only the pnpm content-addressable store is cached (not node_modules), so that
      # pnpm install reconstructs the correct OS-native junctions/symlinks on each platform.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  Run-Tests:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    needs: Setup
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        exclude:
          # The playwright.config.ts excludes WebKit on both Windows and Linux,
          # meaning WebKit tests only run on macOS in this project.
          # On Windows: AudioContext is not enabled in the WebKit build.
          # See: https://github.com/microsoft/playwright/issues/14105
          - os: ubuntu-latest
            browser: webkit
          - os: windows-latest
            browser: webkit

    steps:
      # Playwright snapshot tests generate pngs that are uploaded via
      # git lfs. We therefore have to use git lfs when cloning the repo
      # for tests so that snapshot tests have a truth to asset against
      - name: Checkout
        uses: nschloe/action-cached-lfs-checkout@v1

      - name: Grant Audio Permissions (MacOS)
        if: matrix.os == 'macos-latest'
        run: |
          sqlite3 $HOME/Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR IGNORE INTO access VALUES ('kTCCServiceMicrophone','/usr/local/opt/runner/provisioner/provisioner',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1687786159,NULL,NULL,'UNUSED',1687786159);"
          sqlite3 $HOME/Library/Application\ Support/com.apple.TCC/TCC.db "INSERT OR IGNORE INTO access VALUES ('kTCCServiceMicrophone','/opt/off/opt/runner/provisioner/provisioner',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1687786159,NULL,NULL,'UNUSED',1687786159);"

      - uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Cache is keyed per OS so that Linux packages are never restored on Windows/macOS.
      # Only the pnpm content-addressable store is cached (not node_modules), so that
      # pnpm install reconstructs the correct OS-native junctions/symlinks on each platform.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-v2-${{ matrix.os }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-v2-${{ matrix.os }}-${{ matrix.browser }}-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run tests
        id: tests
        continue-on-error: true
        run: pnpm test --project ${{ matrix.browser }} --shard ${{ matrix.shard }}/4 --retries=0
        env:
          PLAYWRIGHT_SHARD: "true"
          # Include runner OS in the blob report filename so that
          # ubuntu+chromium+shard1 and windows+chromium+shard1 produce different
          # filenames (e.g. report-Linux-chromium-1.zip vs report-Windows-chromium-1.zip).
          # This prevents filename collisions when merge-multiple: true flattens
          # all artifacts into a single directory for playwright merge-reports.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ runner.os }}-${{ matrix.browser }}-${{ matrix.shard }}.zip

      - name: Retry failed tests without competing workers
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("test-results/run.json", "utf8"));
            const lastRun = JSON.parse(readFileSync("test-results/.last-run.json", "utf8"));
            if (report.errors.length > 0 || lastRun.status !== "failed" || lastRun.failedTests.length === 0) {
              throw new Error("The first pass failed outside retryable tests; refusing an empty or misleading retry.");
            }
          '
          # Do not reapply --shard: --last-failed already selects this shard's failures.
          pnpm test --project ${{ matrix.browser }} --last-failed --workers=1 --retries=0 --trace=on
        env:
          PLAYWRIGHT_SHARD: "true"
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-retry
          PLAYWRIGHT_BLOB_OUTPUT_NAME: retry-${{ runner.os }}-${{ matrix.browser }}-${{ matrix.shard }}.zip

      - name: Upload Test Report
        # Upload test report even if tests fail so we can merge reports from all shards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Retry Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-report-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report-retry/
          if-no-files-found: ignore
          retention-days: 1

  Merge-Reports:
    # Run merge reports even if some tests fail so we can still see results
    if: always()
    needs: [Setup, Run-Tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Cache is keyed per OS so that Linux packages are never restored on Windows/macOS.
      # Only the pnpm content-addressable store is cached (not node_modules), so that
      # pnpm install reconstructs the correct OS-native junctions/symlinks on each platform.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download All Test Reports
        uses: actions/download-artifact@v4
        with:
          path: all-test-reports/
          pattern: test-report-*
          merge-multiple: true

      - name: Merge Test Reports
        # Pass --config so merge-reports knows the testDir to normalize paths from
        # different OSes (Linux /home/runner/..., macOS /Users/runner/..., Windows D:\a\...).
        run: pnpm exec playwright merge-reports --config playwright.config.ts --reporter=html,github all-test-reports/

      - name: Download Retry Reports
        uses: actions/download-artifact@v4
        with:
          path: all-retry-reports/
          pattern: retry-report-*
          merge-multiple: true

      - name: Merge Retry Reports
        shell: bash
        run: |
          if compgen -G "all-retry-reports/*.zip" > /dev/null; then
            pnpm exec playwright merge-reports --config playwright.config.ts --reporter=html,github all-retry-reports/
          fi
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-retry-report

      - name: Upload Merged Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Merged Retry Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-retry-report
          path: playwright-retry-report/
          if-no-files-found: ignore
          retention-days: 7
